name: build-image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 后端测试与前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先建前端：assets.go 里有 //go:embed all:web/dist，
      # 目录不存在时 go vet / go test 会直接报 "no matching files found"。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 前端构建（含 vue-tsc 类型检查）
        working-directory: web
        run: pnpm build

      - name: 前端单元测试
        working-directory: web
        run: node --experimental-strip-types --test src/utils/*.test.ts

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  image:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验内容是否已抓取
        run: |
          test -f content/manifest.json || { echo "缺少 content/manifest.json，请先在本地运行 go run ./cmd/crawler 与 go run ./cmd/algocrawler 并提交 content/"; exit 1; }
          echo "文档数: $(grep -o '"slug"' content/manifest.json | wc -l)"
          echo "图片数: $(ls content/img | wc -l)"
          echo "内容体积: $(du -sh content | cut -f1)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          # 只往 GitHub Packages 推，不碰 Docker Hub
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          echo "### 镜像已发布到 GitHub Packages 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 镜像地址：\`ghcr.io/${{ github.repository }}\`，可在仓库右侧 **Packages** 里看到。" >> $GITHUB_STEP_SUMMARY
          echo "> 如果拉取时报 401/denied，把包可见性改成 public，或先 \`docker login ghcr.io\`。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "拉取并运行：" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name learn -p 8080:8080 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e APP_PASSWORD='你的密码' -e JWT_SECRET='一串随机字符' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v learn-data:/data ghcr.io/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
